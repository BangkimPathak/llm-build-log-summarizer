name: LLM-Based Build & Error-Log Summarizer CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test-and-benchmark:
    name: Unit Tests & Compression Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        run: |
          pytest -v

      - name: Run Empirical Summarization Benchmark
        run: |
          python benchmark_summarizer.py

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: summarizer-benchmark-metrics
          path: benchmark_results.json
          retention-days: 14

  simulate-ci-diagnostic:
    name: Simulate Build Failure & Run LLM Summarizer
    runs-on: ubuntu-latest
    needs: test-and-benchmark

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Sample Build Logs
        run: |
          python sample_logs/generate_samples.py

      - name: Run LLM Diagnostic on Python Failure Log
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src --log-file sample_logs/python_pytest_failure.log --step-summary --output-summary python_summary.md

      - name: Run LLM Diagnostic on Node.js Syntax Error Log
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src --log-file sample_logs/node_build_syntax_error.log --step-summary --output-summary node_summary.md

      - name: Run LLM Diagnostic on Docker OOM Failure Log
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src --log-file sample_logs/docker_oom_exit.log --step-summary --output-summary docker_summary.md

      - name: Run LLM Diagnostic on Java Maven Missing Symbol Log
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src --log-file sample_logs/maven_java_compilation.log --step-summary --output-summary maven_summary.md

      - name: Archive Diagnostic Summaries
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostic-summaries
          path: "*_summary.md"
          retention-days: 14
